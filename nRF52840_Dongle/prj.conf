# ── ESB (Enhanced ShockBurst) ─────────────────────────────────────────────
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y

# ── USB HID ───────────────────────────────────────────────────────────────
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_POLL_INTERVAL_MS=1          # 1 ms = 1000 Hz polling
CONFIG_USB_DEVICE_MANUFACTURER="FightPad"
CONFIG_USB_DEVICE_PRODUCT="FightPad 2.4G"
CONFIG_USB_DEVICE_VID=0x1915               # Nordic semi VID (dev/prototype only)
CONFIG_USB_DEVICE_PID=0x52F0

# ── Logging ───────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ── Kernel ────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ── Disable BLE (conflicts with ESB) ─────────────────────────────────────
CONFIG_BT=n
